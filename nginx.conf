# Define an upstream group for the Django application
# This allows Nginx to forward requests to the Django container by service name
upstream django {
    server django_web:8020;
}

server {
    # Nginx listens on port 8020 inside the container
    listen 8020;

    # Serve static files directly from the filesystem (no Django involvement)
    location /static/ {
        alias /app/static/;
    }

    # Serve media files (user uploads) directly from the filesystem
    location /media/ {
        alias /app/media/;
    }

    # All other requests are forwarded to the Django application (Gunicorn)
    location / {
        proxy_pass http://django;

        # Preserve original host header (important for Django allowed hosts)
        proxy_set_header Host $host;

        # Pass real client IP to the backend application
        proxy_set_header X-Real-IP $remote_addr;
    }
}